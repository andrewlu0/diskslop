[package]
name = "diskslop"
version = "0.1.10"
license = "MIT"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
libc = "0.2"
rayon = "1.11"
tempfile = "3"
unicode-normalization = "0.1.26"
zstd = { version = "0.13", default-features = false }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
